<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>EGAWA PORTFOLIO</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Libre+Caslon+Text:ital@0;1&display=swap"
    rel="stylesheet"
  >

  <!-- HOME画像を先読み -->
  <link
    rel="preload"
    as="image"
    href="./images/1218555_0015.JPG"
    fetchpriority="high"
  >

  <style>

    /* ==================================================
       BASE
    ================================================== */

    :root {
      --warm-white: #f3f1ec;
      --black: #111111;
      --gray: #777777;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--warm-white);
      color: var(--black);
      font-family: "Inter", sans-serif;
      overflow-x: hidden;
    }

    body.menu-open {
      overflow: hidden;
    }

    .serif {
      font-family: "Libre Caslon Text", serif;
    }


    /* ==================================================
       HEADER
    ================================================== */

    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 24px 30px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      z-index: 100;

      mix-blend-mode: difference;
      color: white;
    }

    .site-logo {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .menu-button {
      border: none;
      background: none;
      color: inherit;

      font-family: "Inter", sans-serif;
      font-size: 11px;
      letter-spacing: 0.18em;

      cursor: pointer;
      padding: 8px;
    }


    /* ==================================================
       FULL SCREEN MENU
    ================================================== */

    .menu-overlay {
      position: fixed;
      inset: 0;

      z-index: 200;

      background: rgba(17, 17, 17, 0.96);
      color: white;

      display: flex;
      flex-direction: column;
      justify-content: center;

      padding: 8vw;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity 0.5s ease,
        visibility 0.5s ease;
    }

    .menu-overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .menu-close {
      position: absolute;
      top: 24px;
      right: 30px;

      background: none;
      border: none;
      color: white;

      cursor: pointer;

      font-size: 11px;
      letter-spacing: 0.18em;
    }

    .menu-title {
      position: absolute;
      top: 26px;
      left: 30px;

      font-size: 12px;
      letter-spacing: 0.18em;
    }

    .menu-nav {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .menu-nav a {
      color: white;
      text-decoration: none;

      display: flex;
      align-items: baseline;
      gap: 25px;

      opacity: 0.75;

      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
    }

    .menu-nav a:hover {
      opacity: 1;
      transform: translateX(8px);
    }

    .menu-number {
      font-size: 11px;
      letter-spacing: 0.15em;
    }

    .menu-label {
      font-family: "Libre Caslon Text", serif;
      font-size: clamp(42px, 7vw, 100px);
      line-height: 1;
    }

    .menu-social {
      position: absolute;
      bottom: 30px;
      left: 8vw;

      font-size: 11px;
      letter-spacing: 0.12em;
    }


    /* ==================================================
       COMMON ANIMATION
    ================================================== */

    .reveal {
      opacity: 0;
      transform: translateY(40px);

      transition:
        opacity 1s cubic-bezier(0.22, 1, 0.36, 1),
        transform 1s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .delay-1 {
      transition-delay: 0.15s;
    }

    .delay-2 {
      transition-delay: 0.3s;
    }

    .delay-3 {
      transition-delay: 0.45s;
    }


    /* ==================================================
       HOME
    ================================================== */

    #home {
      position: relative;

      width: 100%;
      min-height: 100svh;

      overflow: hidden;

      color: white;
      background: #111;
    }

    .home-bg {
      position: absolute;
      inset: 0;

      background-image: url("./images/1218555_0015.JPG");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      opacity: 0;
      transform: scale(1.08);

      animation:
        homeReveal 2.2s cubic-bezier(0.22, 1, 0.36, 1)
        forwards;
    }

    @keyframes homeReveal {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
